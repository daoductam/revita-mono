spring:
  application:
    name: spring-revita-be
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/revita-drug}
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: false

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${JWT_ISSUER:revita}
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/refresh
      - /api/v1/auth/forgot-password
      - /api/v1/auth/reset-password
      - /api/v1/auth/verify-email
      - /api/v1/auth/verify-phone
      - /api/v1/public/**
      - /api/auth/login
      - /api/auth/register
      - /api/auth/refresh
      - /api/auth/forgot-password
      - /api/auth/reset-password
      - /api/auth/verify-email
      - /api/auth/verify-phone
      - /api/public/**
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
