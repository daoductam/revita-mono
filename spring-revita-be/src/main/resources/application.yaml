spring:
  application:
    name: spring-revita-be
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/revita-drug}
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: false

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${JWT_ISSUER:revita}
    login-access-token-ttl: ${JWT_LOGIN_ACCESS_TTL:15d}
    login-refresh-token-ttl: ${JWT_LOGIN_REFRESH_TTL:30d}
    refresh-access-token-ttl: ${JWT_REFRESH_ACCESS_TTL:15m}
    refresh-refresh-token-ttl: ${JWT_REFRESH_REFRESH_TTL:7d}
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/register/step1
      - /api/v1/register/verify-otp
      - /api/v1/register/resend-otp
      - /api/v1/register/complete
      - /api/v1/users/doctors
      - /api/auth/login
      - /api/auth/refresh
      - /api/register/step1
      - /api/register/verify-otp
      - /api/register/resend-otp
      - /api/register/complete
      - /api/users/doctors
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
