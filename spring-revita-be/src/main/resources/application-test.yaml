spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:revita;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
      - org.springframework.boot.mongodb.autoconfigure.MongoReactiveAutoConfiguration
      - org.springframework.boot.mongodb.autoconfigure.health.MongoHealthContributorAutoConfiguration
      - org.springframework.boot.mongodb.autoconfigure.health.MongoReactiveHealthContributorAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoReactiveRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration

app:
  security:
    jwt-secret: test-only-secret-with-at-least-32-characters
    jwt-issuer: revita-test
    login-access-token-ttl: 15d
    login-refresh-token-ttl: 30d
    refresh-access-token-ttl: 15m
    refresh-refresh-token-ttl: 7d
    public-paths:
      - /__foundation-test/**
      - /api/v1/auth/login
      - /api/auth/login
      - /api/v1/auth/refresh
      - /api/auth/refresh
      - /api/v1/register/**
      - /api/register/**
      - /api/v1/users/doctors
      - /api/users/doctors
  cors:
    allowed-origins: http://localhost:3000

management:
  health:
    mongo:
      enabled: false
    redis:
      enabled: false
